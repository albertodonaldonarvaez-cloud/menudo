# =============================================================
#  DOCKER COMPOSE — Menú Digital
#
#  ✏️  Para cambiar el puerto edita el archivo .env:
#       PORT=8080   →  cambia 8080 al puerto que necesites
#
#  Comandos de uso rápido:
#    Iniciar:     docker compose up -d
#    Detener:     docker compose down
#    Reiniciar:   docker compose restart
#    Ver logs:    docker compose logs -f
#    Actualizar:  git pull && docker compose up -d --build --force-recreate
# =============================================================

services:
  menu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menudo_menu
    restart: unless-stopped
    ports:
      # Puerto externo configurable en .env → Puerto interno fijo 80
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
