# =============================================================
#  DOCKER COMPOSE — Menú Digital v2.0
#
#  Un solo contenedor con Express.js.
#  ✏️  Edita .env para cambiar puerto y credenciales.
#
#  Comandos:
#    Iniciar:    docker compose up -d
#    Detener:    docker compose down
#    Logs:       docker compose logs -f
#    Actualizar: git pull && docker compose up -d --build --force-recreate
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menudo_app
    restart: unless-stopped
    ports:
      - "${PORT:-8070}:3001"
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-cambiar_esta_clave}
    volumes:
      # Persiste la config del menú entre reinicios
      - store_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  store_data:
