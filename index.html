<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title id="pageTitle">Menú Digital</title>
  <meta name="description" content="Menú digital para consultar en mesa: barbacoa, menudo, tacos, quesadillas, bebidas, postres y promos.">
  <meta name="theme-color" content="#C84B31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Menú Digital">
  <link rel="manifest" href="/manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=20261004">
</head>
<body class="public-menu">

  <!-- ── Barra superior: abierto / cerrado + horario ── -->
  <div class="pm-topbar">
    <div class="pm-wrap pm-topbar-inner">
      <span class="pm-status" id="statusBadge">
        <span class="pm-status-dot"></span>
        <span id="statusText">Verificando...</span>
      </span>
      <span class="pm-topbar-schedule" id="headerSchedule">
        <i class="fa-regular fa-clock"></i> Cargando horario...
      </span>
    </div>
  </div>

  <!-- ── Hero ── -->
  <header class="pm-hero">
    <div class="pm-hero-glow" aria-hidden="true"></div>
    <div class="pm-wrap pm-hero-inner">
      <div class="pm-hero-avatar" aria-hidden="true">🔥</div>
      <h1 class="pm-hero-title" id="businessName">Barbacoa &amp; Antojitos</h1>
      <p class="pm-hero-slogan" id="businessSlogan">La barbacoa más rica, recién hecha y bien calientita 🔥</p>
      <div class="pm-hero-chips">
        <span class="pm-chip"><i class="fa-solid fa-utensils"></i> Menú digital en mesa</span>
        <span class="pm-chip" id="heroSchedule" hidden></span>
      </div>
    </div>
  </header>

  <!-- ── Navegación por categoría (se genera dinámicamente) ── -->
  <nav class="pm-nav" id="categoryNav" aria-label="Categorías del menú">
    <div class="pm-wrap">
      <div class="pm-nav-track" id="categoryNavTrack" role="tablist"></div>
    </div>
  </nav>

  <!-- ── Contenido del menú (se genera dinámicamente desde la configuración) ── -->
  <main class="pm-main pm-wrap" id="menuMain">
    <div class="pm-loading" id="menuLoading">
      <div class="pm-spinner"></div>
      <p>Cargando menú...</p>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="pm-footer">
    <div class="pm-wrap pm-footer-inner">
      <p class="pm-footer-name" id="footerBusinessName">Barbacoa &amp; Antojitos</p>
      <p class="pm-footer-sub" id="footerSchedule"></p>
      <p class="pm-footer-sub">¡Gracias por visitarnos y buen provecho! 🙌</p>
      <div class="pm-footer-admin">
        <a href="/login" class="pm-admin-link">
          <i class="fa-solid fa-lock"></i> Panel de Administración
        </a>
      </div>
    </div>
  </footer>

  <script src="data.js?v=20261004"></script>
  <script src="app.js?v=20261004"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW:', e));
    }
  </script>
</body>
</html>
