<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Menú Digital</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=20260829">
</head>
<body>

  <!-- ── Barra de estado: abierto/cerrado + horario ───────────── -->
  <div class="top-status-bar" id="topStatusBar">
    <span id="statusBadge" class="status-badge status-loading">
      <span class="status-dot"></span>
      <span id="statusText">Verificando...</span>
    </span>
    <span class="top-schedule" id="topSchedule">──</span>
    <span class="top-label">
      <i class="fa-solid fa-mobile-screen-button"></i> Menú Digital en Mesa
    </span>
  </div>

  <!-- ── Header del negocio ──────────────────────────────────── -->
  <header class="hero-header">
    <div class="hero-brand">
      <div class="hero-flame">🔥</div>
      <div class="hero-text">
        <h1 id="heroName">Birriería &amp; Antojitos</h1>
        <p id="heroSlogan">La birria más rica, recién hecha y bien calientita 🔥</p>
      </div>
    </div>
  </header>

  <!-- ── Navegación por categoría ────────────────────────────── -->
  <nav class="category-nav-wrapper" id="categoryNav">
    <div class="category-nav">
      <button class="cat-btn active" data-category="all">
        <span>🍽️</span><span>Todos</span>
      </button>
      <button class="cat-btn" data-category="menudo">
        <span>🍲</span><span>Menudo</span>
      </button>
      <button class="cat-btn" data-category="birria">
        <span>🥩</span><span>Birria</span>
      </button>
      <button class="cat-btn" data-category="tacos">
        <span>🌮</span><span>Tacos</span>
      </button>
      <button class="cat-btn" data-category="quesadillas">
        <span>🧀</span><span>Quesadillas</span>
      </button>
    </div>
  </nav>

  <!-- ── Secciones de productos ───────────────────────────────── -->
  <main class="menu-main" id="menuMain">

    <section class="product-section" id="section-menudo" data-product="menudo">
      <div id="card-menudo"></div>
    </section>

    <section class="product-section" id="section-birria" data-product="birria">
      <div id="card-birria"></div>
    </section>

    <section class="product-section" id="section-tacos" data-product="tacos">
      <div id="card-tacos"></div>
    </section>

    <section class="product-section" id="section-quesadillas" data-product="quesadillas">
      <div id="card-quesadillas"></div>
    </section>

  </main>

  <!-- ── Footer ───────────────────────────────────────────────── -->
  <footer class="menu-footer">
    <p id="footerSchedule"></p>
    <a href="/admin.html" class="footer-admin-link" aria-label="Panel de administración">
      <i class="fa-solid fa-gear"></i>
    </a>
  </footer>

  <script src="data.js?v=20260829"></script>
  <script src="app.js?v=20260829"></script>
</body>
</html>
