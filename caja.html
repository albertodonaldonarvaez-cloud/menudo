<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caja POS">
  <meta name="theme-color" content="#C84B31">
  <link rel="manifest" href="/manifest.json">
  <title>Caja — POS</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    :root{
      --bg:#F5F6FA;--bg2:#FFFFFF;--bg3:#F0F0F3;--border:#E2E4EC;
      --text:#1F2937;--muted:#6B7280;--primary:#C84B31;
      --green:#16A34A;--red:#DC2626;--amber:#D97706;--blue:#2563EB;
    }

    html,body{
      font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);
      height:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
    }
    body>*{flex-shrink:0}

    /* ── Header ─────────────────────────────── */
    .pos-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 12px;height:48px;background:#1E2022;flex-shrink:0;
    }
    .pos-bar-left{display:flex;align-items:center;gap:8px}
    .pos-logo{font-size:1.2rem}
    .pos-biz-name{font-size:0.9rem;font-weight:800;color:#fff}
    .pos-bar-right{display:flex;align-items:center;gap:8px}
    .pos-clock{font-size:0.8rem;color:#9CA3AF;font-weight:600;min-width:52px;text-align:right}
    .pos-bar-action{
      display:flex;align-items:center;gap:4px;color:#9CA3AF;text-decoration:none;
      font-size:0.75rem;font-weight:700;padding:4px 8px;border-radius:8px;
      background:rgba(255,255,255,0.07);transition:background 0.15s;
    }
    .pos-bar-action:hover{background:rgba(255,255,255,0.14)}
    .pos-logout-text{font-size:0.72rem}

    /* ── Mobile tabs (3 tabs) ───────────────── */
    .pos-mobile-tabs{
      display:none;
      background:#1E2022;
      border-top:1px solid #374151;
      flex-shrink:0;
    }
    @media(max-width:639px){
      .pos-mobile-tabs{display:flex}
    }
    .pos-mtab{
      flex:1;padding:8px 4px;background:none;border:none;color:#9CA3AF;
      font-family:'Outfit',sans-serif;font-size:0.72rem;font-weight:700;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
      position:relative;text-transform:uppercase;letter-spacing:0.5px;
    }
    .pos-mtab i{font-size:1rem}
    .pos-mtab.active{color:#fff}
    .pos-mtab-badge{
      display:none;position:absolute;top:2px;right:calc(50% - 18px);
      background:var(--primary);color:#fff;font-size:0.6rem;font-weight:900;
      border-radius:10px;min-width:16px;height:16px;line-height:16px;
      text-align:center;padding:0 3px;
    }
    .pos-mtab-badge.cobrar-badge{background:var(--green)}
    .pos-mtab-badge.show{display:block}

    /* ── Layout principal ───────────────────── */
    .pos-root{
      flex:1 1 0;min-height:0;display:flex;overflow:hidden;
    }

    /* ── Panel izquierdo — Productos ────────── */
    .pos-left{
      width:60%;min-width:0;height:100%;
      display:flex;flex-direction:column;overflow:hidden;
      border-right:1.5px solid var(--border);
    }
    .pos-products-grid{
      flex:1 1 0;min-height:0;overflow-y:auto;
      padding:10px;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:8px;
      align-content:start;
    }

    /* ── Botones de producto ─────────────────── */
    .pos-btn{
      position:relative;background:var(--bg2);border:1.5px solid var(--border);
      border-radius:14px;padding:12px 8px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:4px;
      font-family:'Outfit',sans-serif;color:var(--text);
      transition:transform 0.1s,box-shadow 0.1s;
      min-height:90px;
    }
    .pos-btn:active{transform:scale(0.95)}
    .pos-btn.flash{background:#FEF3C7;border-color:var(--amber)}
    .pos-btn-qty-badge{
      display:none;position:absolute;top:-5px;right:-5px;
      background:var(--primary);color:#fff;font-size:0.62rem;font-weight:900;
      border-radius:10px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 3px;
    }
    .pos-btn-qty-badge.show{display:block}
    .pos-btn-qty-libre{background:var(--amber)}
    .pos-btn-emoji{font-size:1.6rem;line-height:1}
    .pos-btn-name{font-size:0.72rem;font-weight:700;text-align:center;line-height:1.2}
    .pos-btn-price{font-size:0.8rem;font-weight:800;color:var(--primary)}
    .pos-btn-note{font-size:0.6rem;color:var(--muted);text-align:center}
    .pos-libre-label{color:var(--amber)}

    /* Botones libres */
    .pos-btn-libre{border:2px dashed var(--primary);background:#FFF5F3}
    .pos-btn-libre-barb{border:2px dashed var(--amber);background:#FFFBEB}
    .pos-btn-kilo{border:2px solid var(--amber);background:linear-gradient(145deg,#FFFBEB,#FEF3C7);}
    .pos-btn-kilo:hover{background:linear-gradient(145deg,#FEF3C7,#FDE68A);border-color:#B45309;}
    .pos-btn-kilo .pos-libre-label{color:var(--amber);font-weight:800;}

    /* Promos */
    .pos-promo-divider{
      grid-column:1/-1;display:flex;align-items:center;gap:8px;
      font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;
      letter-spacing:0.8px;padding:4px 0;
    }
    .pos-promo-divider::before,.pos-promo-divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .pos-btn-promo{border-color:#E9D5FF;background:#FDFAFF}
    .pos-btn-promo .pos-btn-price{color:#7C3AED}

    /* ── Panel derecho ───────────────────────── */
    .pos-right{
      flex:1 1 0;min-width:0;height:100%;
      display:flex;flex-direction:column;overflow:hidden;
      background:var(--bg);
    }

    /* Sección nueva orden */
    .new-order-section{
      flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    }

    /* Nombre + tipo en la parte superior */
    .order-meta-bar{
      flex-shrink:0;padding:8px 10px 6px;background:var(--bg2);
      border-bottom:1.5px solid var(--border);
      display:flex;flex-direction:column;gap:6px;
    }
    .client-name-label{
      font-size:0.6rem;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;
      color:var(--muted);display:flex;align-items:center;gap:5px;
    }
    .client-name-label .req{color:var(--primary);font-size:0.7rem}
    .client-name-input{
      width:100%;padding:9px 11px;border:2px solid var(--border);border-radius:10px;
      font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:700;
      color:var(--text);background:#fff;outline:none;transition:border-color 0.15s;
    }
    .client-name-input:focus{border-color:var(--primary)}
    .client-name-input.shake{animation:shake 0.4s}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

    /* Toggle Aquí / Para Llevar */
    .order-type-toggle{display:flex;gap:6px}
    .order-type-btn{
      flex:1;padding:7px;border:2px solid var(--border);border-radius:10px;
      background:#fff;font-family:'Outfit',sans-serif;font-size:0.78rem;font-weight:700;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
      color:var(--muted);transition:all 0.15s;
    }
    .order-type-btn.active{border-color:var(--primary);background:#FFF5F3;color:var(--primary)}
    .order-type-btn.llevar.active{border-color:var(--amber);background:#FFFBEB;color:var(--amber)}

    /* Ticket list */
    .ticket-list{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px}
    .ticket-empty{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;gap:8px;color:var(--muted);font-size:0.85rem;text-align:center;opacity:0.6;
    }
    .ticket-empty i{font-size:2rem}
    .ticket-row{
      display:flex;align-items:center;gap:8px;
      padding:7px 8px;background:var(--bg2);border-radius:10px;
      margin-bottom:5px;border:1px solid var(--border);
    }
    .ticket-emoji{font-size:1.1rem;flex-shrink:0}
    .ticket-info{flex:1;min-width:0}
    .ticket-name{font-size:0.82rem;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ticket-note{font-size:0.65rem;color:var(--muted)}
    .ticket-qty-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
    .ticket-qty-ctrl button{
      width:22px;height:22px;border:1.5px solid var(--border);border-radius:6px;
      background:var(--bg3);cursor:pointer;font-size:0.85rem;font-weight:700;
      display:flex;align-items:center;justify-content:center;
    }
    .ticket-qty-ctrl span{font-size:0.82rem;font-weight:700;min-width:16px;text-align:center}
    .ticket-sub{font-size:0.82rem;font-weight:800;color:var(--primary);flex-shrink:0}

    /* Total */
    .ticket-total-bar{
      flex-shrink:0;padding:8px 12px;
      display:flex;align-items:center;justify-content:space-between;
      background:var(--bg2);border-top:2px solid var(--border);
    }
    .ticket-total-label{font-size:0.8rem;font-weight:700;color:var(--muted)}
    .ticket-total-amount{font-size:1.3rem;font-weight:900;color:var(--text)}
    .ticket-total-amount.pop{animation:pop 0.25s}
    @keyframes pop{0%{transform:scale(1.18)}100%{transform:scale(1)}}

    /* Botón Enviar a Cocina */
    .enviar-wrap{flex-shrink:0;padding:8px 10px 10px}
    .enviar-btn{
      width:100%;padding:15px;border:none;border-radius:14px;
      background:linear-gradient(135deg,#16A34A,#15803D);
      color:#fff;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:800;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
      transition:all 0.2s;box-shadow:0 4px 20px rgba(22,163,74,0.28);
    }
    .enviar-btn:hover:not(:disabled){opacity:0.92}
    .enviar-btn:active:not(:disabled){transform:scale(0.97)}
    .enviar-btn:disabled{background:#E5E7EB;color:#9CA3AF;cursor:not-allowed;box-shadow:none}

    /* ── Sección "Por Cobrar" ────────────────── */
    .por-cobrar-section{
      flex-shrink:0;max-height:45%;min-height:0;
      display:flex;flex-direction:column;overflow:hidden;
      border-top:2px solid var(--border);background:var(--bg2);
    }
    .por-cobrar-header{
      flex-shrink:0;padding:8px 12px 6px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .por-cobrar-title{
      font-size:0.72rem;font-weight:800;text-transform:uppercase;
      letter-spacing:0.8px;color:var(--muted);display:flex;align-items:center;gap:6px;
    }
    .por-cobrar-count{
      background:var(--green);color:#fff;font-size:0.62rem;font-weight:900;
      border-radius:10px;min-width:18px;height:18px;line-height:18px;
      text-align:center;padding:0 4px;display:none;
    }
    .por-cobrar-count.show{display:block}

    /* Lista de órdenes pendientes */
    .pending-orders-list{
      flex:1 1 0;min-height:0;overflow-y:auto;
      padding:0 8px 6px;display:flex;flex-direction:column;gap:5px;
    }
    .pending-empty{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px 8px;gap:6px;color:var(--muted);font-size:0.78rem;text-align:center;opacity:0.6;
    }
    .pending-empty i{font-size:1.5rem}
    .pending-card{
      border:2px solid var(--border);border-radius:10px;padding:8px 10px;
      cursor:pointer;background:var(--bg);transition:border-color 0.15s;
    }
    .pending-card.selected{border-color:var(--green);background:#F0FDF4}
    .pending-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
    .pending-type{font-size:0.68rem;font-weight:800;padding:2px 7px;border-radius:8px}
    .pending-type.aqui{background:#EEF2FF;color:#3730A3}
    .pending-type.llevar{background:#FFFBEB;color:#92400E}
    .pending-time{font-size:0.62rem;color:var(--muted)}
    .pending-name{font-size:0.88rem;font-weight:800;display:flex;align-items:center;gap:5px;margin-bottom:2px}
    .pending-items{font-size:0.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pending-total{font-size:0.85rem;font-weight:800;color:var(--primary);text-align:right;margin-top:2px}

    /* Sección de pago para pendiente seleccionado */
    .pending-pay-section{
      flex-shrink:0;padding:8px 10px 10px;
      border-top:1.5px solid var(--border);background:#F0FDF4;
    }
    .pending-pay-section.hidden{display:none}
    .pending-pay-who{font-size:0.75rem;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:5px}
    .pending-pay-who strong{color:var(--text)}
    .pending-pay-btns{display:flex;gap:5px;margin-bottom:6px}
    .pending-pay-btn{
      flex:1;padding:8px 4px;border:2px solid var(--border);border-radius:9px;
      background:#fff;font-family:'Outfit',sans-serif;font-size:0.72rem;font-weight:700;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
      color:var(--text);transition:all 0.15s;
    }
    .pending-pay-btn.active{border-color:var(--green);background:rgba(22,163,74,0.08);color:var(--green)}
    .cobrar-pendiente-btn{
      width:100%;padding:13px;border:none;border-radius:12px;
      background:linear-gradient(135deg,#16A34A,#15803D);color:#fff;
      font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:800;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
      box-shadow:0 3px 12px rgba(22,163,74,0.3);
    }
    .cobrar-pendiente-btn:disabled{background:#E5E7EB;color:#9CA3AF;box-shadow:none}

    /* ── Mobile overrides ────────────────────── */
    @media(max-width:639px){
      .pos-left{width:100%!important;border-right:none!important}
      .pos-right{
        width:100%!important;min-width:unset!important;
        height:100%;display:flex;flex-direction:column;overflow:hidden;
      }
      .mobile-hidden{display:none!important}
      .mobile-hidden-section{display:none!important}
      /* En móvil la sección por cobrar ocupa todo el panel derecho */
      .por-cobrar-section{
        border-top:none;max-height:unset;flex:1 1 0;
      }
      .new-order-section{flex:1 1 0}
    }
    @media(min-width:640px){
      /* En desktop, por cobrar siempre visible */
      .por-cobrar-section{display:flex!important}
    }

    /* ── Modal precio libre ──────────────────── */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;z-index:100;
    }
    .modal-overlay.hidden{display:none}
    .modal-box{
      background:var(--bg2);border-radius:18px;padding:24px;
      width:min(340px,90vw);box-shadow:0 20px 60px rgba(0,0,0,0.25);
      display:flex;flex-direction:column;align-items:center;gap:12px;
    }
    .price-modal-emoji{font-size:2.5rem}
    .price-modal-title{font-size:1.1rem;font-weight:800}
    .price-modal-input{
      width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;
      font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;
      text-align:center;outline:none;
    }
    .price-modal-input:focus{border-color:var(--primary)}
    .price-modal-actions{display:flex;gap:8px;width:100%}
    .price-modal-cancel{
      flex:1;padding:12px;border:2px solid var(--border);border-radius:12px;
      background:var(--bg3);font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;
    }
    .price-modal-confirm{
      flex:2;padding:12px;border:none;border-radius:12px;
      background:linear-gradient(135deg,var(--primary),#A83D27);
      color:#fff;font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:800;cursor:pointer;
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="pos-bar">
    <div class="pos-bar-left">
      <div class="pos-logo">🔥</div>
      <span class="pos-biz-name" id="posBusinessName">Caja</span>
    </div>
    <div class="pos-bar-right">
      <span class="pos-clock" id="posClock">--:--</span>
      <a href="/cocina" class="pos-bar-action" style="color:#D97706;">
        <i class="fa-solid fa-fire-burner"></i>
        <span class="pos-logout-text">Cocina</span>
      </a>
      <a href="/logout" class="pos-bar-action" title="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span class="pos-logout-text">Salir</span>
      </a>
    </div>
  </header>

  <!-- ── Layout principal ─────────────────────────────────────── -->
  <div class="pos-root">

    <!-- Panel izquierdo: productos -->
    <div class="pos-left" id="posLeftPanel">
      <div class="pos-products-grid" id="posProductsGrid">
        <!-- renderizado por caja.js -->
      </div>
    </div>

    <!-- Panel derecho: nueva orden + por cobrar -->
    <div class="pos-right" id="posRightPanel">

      <!-- ── Sección: Nueva Orden ── -->
      <div class="new-order-section" id="newOrderSection">

        <!-- Nombre + tipo -->
        <div class="order-meta-bar">
          <div class="client-name-label">
            <i class="fa-solid fa-user"></i> Nombre del cliente <span class="req">*</span>
          </div>
          <input type="text" id="clientNameInput" class="client-name-input"
            placeholder="Juan, Mesa 3, Para llevar..." autocomplete="off" maxlength="40">

          <div class="order-type-toggle">
            <button id="btnTypeAqui" class="order-type-btn active" onclick="setOrderType('aqui')">
              <i class="fa-solid fa-utensils"></i> Aquí
            </button>
            <button id="btnTypeLlevar" class="order-type-btn llevar" onclick="setOrderType('llevar')">
              <i class="fa-solid fa-bag-shopping"></i> Para Llevar
            </button>
          </div>
        </div>

        <!-- Ticket -->
        <div class="ticket-list" id="ticketList">
          <div class="ticket-empty">
            <i class="fa-regular fa-receipt"></i>
            <span>Ticket vacío<br>Toca un producto</span>
          </div>
        </div>

        <!-- Total -->
        <div class="ticket-total-bar">
          <span class="ticket-total-label">Total</span>
          <span class="ticket-total-amount" id="ticketTotal">$0</span>
        </div>

        <!-- Botón Enviar a Cocina -->
        <div class="enviar-wrap">
          <button class="enviar-btn" id="enviarCocinaBtn" onclick="sendToKitchenPrimary()" disabled>
            <i class="fa-solid fa-fire-burner"></i>
            Enviar a Cocina
          </button>
        </div>

      </div><!-- /new-order-section -->

      <!-- ── Sección: Por Cobrar ── -->
      <div class="por-cobrar-section" id="porCobrarSection">

        <div class="por-cobrar-header">
          <span class="por-cobrar-title">
            <i class="fa-solid fa-coins"></i>
            Por Cobrar
            <span class="por-cobrar-count" id="porCobrarCount">0</span>
          </span>
        </div>

        <!-- Lista de órdenes pendientes -->
        <div class="pending-orders-list" id="pendingOrdersList">
          <div class="pending-empty">
            <i class="fa-solid fa-check-circle"></i>
            <span>Sin órdenes pendientes</span>
          </div>
        </div>

        <!-- Panel de cobro al seleccionar una orden -->
        <div class="pending-pay-section hidden" id="pendingPaySection">
          <div class="pending-pay-who">
            Cobrar a: <strong id="payOrderName">—</strong>
            &nbsp;·&nbsp; <span id="payOrderTotal" style="color:var(--primary);font-weight:800">$0</span>
          </div>
          <div class="pending-pay-btns">
            <button id="pendPayEfectivo" class="pending-pay-btn active"
              onclick="selectPendingPayment('efectivo',this)">
              <i class="fa-solid fa-money-bills"></i> Efectivo
            </button>
            <button id="pendPayTarjeta" class="pending-pay-btn"
              onclick="selectPendingPayment('tarjeta',this)">
              <i class="fa-solid fa-credit-card"></i> Tarjeta
            </button>
            <button id="pendPayTransferencia" class="pending-pay-btn"
              onclick="selectPendingPayment('transferencia',this)">
              <i class="fa-solid fa-mobile-screen-button"></i> Transfer
            </button>
          </div>
          <button class="cobrar-pendiente-btn" id="cobrarPendienteBtn" onclick="collectPayment()">
            <i class="fa-solid fa-circle-check"></i>
            <span id="cobrarPendienteLabel">Cobrar</span>
          </button>
        </div>

      </div><!-- /por-cobrar-section -->

    </div><!-- /pos-right -->

  </div><!-- /pos-root -->

  <!-- ── Tab bar móvil (3 tabs) ──────────────────────────────── -->
  <div class="pos-mobile-tabs" id="posMobileTabs">
    <button class="pos-mtab active" id="mtabProductos" onclick="switchMobileTab('productos')">
      <i class="fa-solid fa-grid-2"></i>
      <span>Productos</span>
    </button>
    <button class="pos-mtab" id="mtabTicket" onclick="switchMobileTab('ticket')">
      <i class="fa-solid fa-receipt"></i>
      <span>Orden</span>
      <span class="pos-mtab-badge" id="mtabBadge">0</span>
    </button>
    <button class="pos-mtab" id="mtabCobrar" onclick="switchMobileTab('cobrar')">
      <i class="fa-solid fa-coins"></i>
      <span>Cobrar</span>
      <span class="pos-mtab-badge cobrar-badge" id="mtabCobrarBadge">0</span>
    </button>
  </div>

  <!-- ── Modal precio libre ───────────────────────────────────── -->
  <div class="modal-overlay hidden" id="priceModal" onclick="closePriceModal(event)">
    <div class="modal-box">
      <div class="price-modal-emoji" id="priceModalEmoji">🍲</div>
      <div class="price-modal-title" id="priceModalLabel">Precio libre</div>
      <input type="number" id="priceModalInput" class="price-modal-input"
        placeholder="$ precio" min="1" step="0.5"
        onkeydown="if(event.key==='Enter')confirmPriceModal()">
      <div class="price-modal-actions">
        <button class="price-modal-cancel" onclick="closePriceModal({target:document.getElementById('priceModal')})">Cancelar</button>
        <button class="price-modal-confirm" onclick="confirmPriceModal()">Agregar al ticket</button>
      </div>
    </div>
  </div>

  <!-- ── Modal calculadora Barbacoa × Kilo ────────────────────── -->
  <style>
    .kilo-modal-box{max-width:360px;width:92vw;}
    .kilo-product-name{font-size:1.05rem;font-weight:800;text-align:center;}
    .kilo-price-ref{font-size:0.8rem;color:var(--muted);text-align:center;margin-top:2px;}
    .kilo-mode-toggle{display:flex;gap:6px;width:100%;}
    .kilo-mode-btn{
      flex:1;padding:9px;border:2px solid var(--border);border-radius:10px;
      background:#fff;font-family:'Outfit',sans-serif;font-size:0.8rem;font-weight:700;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
      color:var(--muted);transition:all 0.15s;
    }
    .kilo-mode-btn.active{border-color:var(--amber);background:#FFFBEB;color:var(--amber);}
    .kilo-input-wrap{width:100%;position:relative;}
    .kilo-input{
      width:100%;padding:12px 44px 12px 12px;border:2px solid var(--border);border-radius:12px;
      font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;
      text-align:center;outline:none;
    }
    .kilo-input:focus{border-color:var(--amber);}
    .kilo-input-unit{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      font-size:0.85rem;font-weight:700;color:var(--muted);pointer-events:none;
    }
    .kilo-result{
      font-size:1rem;font-weight:800;color:var(--green);text-align:center;
      min-height:1.4em;
    }
  </style>

  <div class="modal-overlay hidden" id="kiloModal" onclick="closeKiloModal(event)">
    <div class="modal-box kilo-modal-box">
      <div class="kilo-product-name" id="kiloProductName">🥩 Barbacoa × Kilo</div>
      <div class="kilo-price-ref" id="kiloPricePerKg">$250 / kg</div>

      <!-- Toggle kg / precio -->
      <div class="kilo-mode-toggle">
        <button id="kiloModeKg" class="kilo-mode-btn active" onclick="setKiloMode('kg')">
          <i class="fa-solid fa-weight-hanging"></i> Ingresar kg
        </button>
        <button id="kiloModePrecio" class="kilo-mode-btn" onclick="setKiloMode('precio')">
          <i class="fa-solid fa-dollar-sign"></i> Ingresar precio
        </button>
      </div>

      <!-- Etiqueta dinámica -->
      <div style="font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;width:100;" id="kiloInputLabel">Kilos a vender</div>

      <!-- Input con unidad -->
      <div class="kilo-input-wrap">
        <input type="number" id="kiloInput" class="kilo-input"
          placeholder="0" min="0" step="0.1"
          oninput="updateKiloCalc()"
          onkeydown="if(event.key==='Enter')confirmKiloModal()">
        <span class="kilo-input-unit" id="kiloInputUnit">kg</span>
      </div>

      <!-- Resultado calculado -->
      <div class="kilo-result" id="kiloResult"></div>

      <!-- Acciones -->
      <div class="price-modal-actions">
        <button class="price-modal-cancel" onclick="closeKiloModal({target:document.getElementById('kiloModal')})">Cancelar</button>
        <button class="price-modal-confirm" style="background:linear-gradient(135deg,var(--amber),#B45309);" onclick="confirmKiloModal()">Agregar al ticket</button>
      </div>
    </div>
  </div>

  <script src="data.js?v=20260902"></script>
  <script src="caja.js?v=20260902"></script>
</body>
</html>
