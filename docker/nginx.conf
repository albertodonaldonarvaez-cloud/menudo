# =============================================================
#  NGINX CONFIG — Contenedor Docker
#  Correcciones:
#  - URL raíz "/" sirve index.html actualizado (sin caché HTML)
#  - Headers de seguridad
#  - Caché solo para assets estáticos (CSS/JS/imágenes)
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Ocultar versión de Nginx ────────────────────────────
    server_tokens off;

    # ─── Compresión gzip ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ─── URL raíz → index.html siempre fresco ───────────────
    # FIX: sin esto, "/" podía servir una versión cacheada vieja
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma        "no-cache";
        expires -1;
        try_files /index.html =404;
    }

    # ─── Todos los .html sin caché ───────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma        "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # ─── Assets estáticos — caché agresivo ──────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Resto de archivos ───────────────────────────────────
    location / {
        try_files $uri =404;
    }
}
