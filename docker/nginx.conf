# =============================================================
#  NGINX CONFIG — Contenedor Docker
#  - Sirve archivos estáticos sin caché en HTML
#  - Proxea /api/ al backend Node.js interno
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ─── API → Backend Node.js ────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header         Cache-Control "no-store" always;
    }

    # ─── URL raíz → index.html SIEMPRE fresco ─────────────────
    location = / {
        etag              off;
        if_modified_since off;
        add_header        Last-Modified "" always;
        add_header        Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header        Pragma "no-cache" always;
        expires           -1;
        try_files         /index.html =404;
    }

    # ─── HTML sin caché ni ETag ───────────────────────────────
    location ~* \.html$ {
        etag              off;
        if_modified_since off;
        add_header        Last-Modified "" always;
        add_header        Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header        Pragma "no-cache" always;
        expires           -1;
        try_files         $uri =404;
    }

    # ─── Assets estáticos (CSS/JS) — caché por versión ───────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     7d;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    location / {
        try_files $uri =404;
    }
}
