# =============================================================
#  NGINX CONFIG — Contenedor Docker (Sin auth, solo archivos)
#  La autenticación del admin la maneja el Nginx del proxy externo.
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compresión gzip ────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ─── Caché de archivos estáticos ────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Servir todos los archivos normalmente ───────────────
    # (La protección del admin la hace el proxy externo)
    location / {
        try_files $uri $uri/ =404;
    }
}
