# =============================================================
#  NGINX CONFIG — Menú Digital
#  - Sirve archivos estáticos con compresión gzip
#  - Protege /admin.html con HTTP Basic Auth
#  - El menú público (/index.html) es accesible sin contraseña
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compresión gzip para mejorar velocidad ─────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ─── Caché de archivos estáticos ────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Menú público — SIN restricción ─────────────────────
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # ─── Panel de Administración — CON contraseña ───────────
    location = /admin.html {
        auth_basic           "Panel de Administración";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        try_files /admin.html =404;
    }

    # ─── Resto de archivos estáticos ────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ─── Páginas de error personalizadas ────────────────────
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /index.html;
}
