# =============================================================
#  NGINX CONFIG — Contenedor Docker
#  Correcciones de caché móvil:
#  - ETag desactivado en HTML (evita 304 Not Modified falso)
#  - Last-Modified eliminado en HTML
#  - URL raíz "/" siempre sirve index.html fresco
#  - Headers de seguridad
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Ocultar versión de Nginx ────────────────────────────
    server_tokens off;

    # ─── Compresión gzip ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ─── URL raíz → index.html SIEMPRE fresco ────────────────
    location = / {
        etag              off;
        if_modified_since off;
        add_header        Last-Modified      ""                                           always;
        add_header        Cache-Control      "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header        Pragma             "no-cache"                                   always;
        expires           -1;
        try_files         /index.html =404;
    }

    # ─── Todos los .html sin caché ni ETag ──────────────────
    location ~* \.html$ {
        etag              off;
        if_modified_since off;
        add_header        Last-Modified      ""                                           always;
        add_header        Cache-Control      "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header        Pragma             "no-cache"                                   always;
        expires           -1;
        try_files         $uri =404;
    }

    # ─── Assets estáticos — caché agresivo ──────────────────
    # El ?v=FECHA en las URLs garantiza que se descarguen al actualizar
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires           7d;
        add_header        Cache-Control "public, immutable";
        access_log        off;
    }

    # ─── Resto de archivos ───────────────────────────────────
    location / {
        try_files $uri =404;
    }
}
