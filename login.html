<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administración | Menú Digital</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #1a0a00 0%, #2d1200 50%, #1a0a00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      text-align: center;
    }

    .login-icon {
      font-size: 3rem;
      margin-bottom: 6px;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1F2937;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: #6B7280;
      margin-bottom: 32px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-icon-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      font-size: 1rem;
      font-family: 'Outfit', sans-serif;
      color: #1F2937;
      transition: border-color 0.2s;
      background: #F9FAFB;
    }

    .form-group input:focus {
      outline: none;
      border-color: #E38B29;
      background: #fff;
    }

    .error-box {
      background: #FEF2F2;
      border: 1.5px solid #FCA5A5;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: #DC2626;
      font-weight: 600;
      text-align: left;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #E38B29, #C84B31);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover  { opacity: 0.92; }
    .btn-login:active { transform: scale(0.98); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #6B7280;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #E38B29; }

    .divider {
      border: none;
      border-top: 1.5px solid #F3F4F6;
      margin: 24px 0 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🍲</div>
    <h1 class="login-title">Panel de Administración</h1>
    <p class="login-subtitle">Inicia sesión para gestionar el menú del día</p>

    <!-- Error de credenciales -->
    <div class="error-box" id="errorBox" style="display:none;">
      <i class="fa-solid fa-circle-exclamation"></i>
      Usuario o contraseña incorrectos. Intenta de nuevo.
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="user">Usuario</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-user"></i>
          <input
            type="text"
            id="user"
            name="user"
            placeholder="admin"
            required
            autocomplete="username"
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket"></i>
        Entrar al Panel
      </button>
    </form>

    <hr class="divider">
    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Volver al Menú
    </a>
  </div>

  <script>
    // Mostrar error si la URL contiene ?error=1
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorBox').style.display = 'flex';
    }
  </script>
</body>
</html>
