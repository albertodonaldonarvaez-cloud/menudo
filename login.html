<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon / íconos La Familia -->
    <link rel="icon" href="/favicon.ico?v=20261015" sizes="48x48">
    <link rel="icon" href="/brand/favicon.svg?v=20261015" type="image/svg+xml">
    <link rel="icon" href="/brand/icons/favicon-32.png?v=20261015" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png?v=20261015" sizes="180x180">
    <meta name="theme-color" content="#231F20">
  <title>Acceso Administración | La Familia — Menudo y Barbacoa</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="/brand/brand.css?v=20261015">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--lf-font-label);
      background-color: var(--lf-crema-2);
      background-image: var(--lf-trama-crema);
      background-size: 260px 260px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; color: var(--lf-carbon);
    }
    .login-card {
      background: var(--lf-crema); border: 1.5px solid var(--lf-linea);
      border-radius: var(--lf-radius-lg); padding: 36px 34px 28px;
      width: 100%; max-width: 410px; box-shadow: var(--lf-shadow-lg);
      text-align: center; position: relative; overflow: hidden;
    }
    .login-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--lf-terracota); }
    @media (max-width: 479px) { .login-card { padding: 28px 20px 22px; border-radius: 16px; } }
    .login-lockup { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .login-lockup img { width: 88px; height: auto; margin-bottom: 8px; }
    .login-lockup .name { font-family: var(--lf-font-display); font-weight: 900; font-size: 2.3rem; line-height: 1; color: var(--lf-carbon); }
    .login-lockup .lf-heart-rule { width: 200px; margin: 8px 0 6px; font-size: 0.8rem; }
    .login-lockup .sub { font-family: var(--lf-font-label); font-weight: 700; font-size: 0.66rem; letter-spacing: 0.32em; color: var(--lf-terracota); text-transform: uppercase; padding-left: .32em; }
    .login-lockup .tag { font-family: var(--lf-font-serif); font-style: italic; font-size: 0.82rem; color: var(--lf-tierra); margin-top: 6px; }
    .login-title { font-family: var(--lf-font-label); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lf-carbon); margin: 4px 0 4px; padding-top: 18px; border-top: 1.5px solid var(--lf-linea); }
    .login-subtitle { font-size: 0.85rem; color: var(--lf-tierra); margin-bottom: 22px; }
    .login-subtitle strong { color: var(--lf-carbon); }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--lf-carbon); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.2em; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--lf-tierra); font-size: 0.9rem; }
    .form-group input {
      width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid var(--lf-linea-2);
      border-radius: var(--lf-radius-sm); font-size: 1rem; font-family: var(--lf-font-label);
      color: var(--lf-carbon); transition: border-color 0.2s, box-shadow 0.2s; background: #fff;
    }
    .form-group input:focus { outline: none; border-color: var(--lf-terracota); box-shadow: 0 0 0 3px var(--lf-terracota-soft); }
    .error-box {
      background: var(--lf-error-soft); border: 1.5px solid #E6B3A5; border-radius: var(--lf-radius-sm);
      padding: 10px 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
      font-size: 0.88rem; color: var(--lf-error); font-weight: 600; text-align: left;
    }
    .btn-login {
      width: 100%; padding: 15px; background: var(--lf-terracota); color: #fff; border: none;
      border-radius: 999px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      font-family: var(--lf-font-label); cursor: pointer; margin-top: 8px;
      transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 16px rgba(184, 74, 39, 0.28);
    }
    .btn-login:hover  { background: var(--lf-terracota-dark); }
    .btn-login:active { transform: scale(0.98); }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--lf-tierra); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--lf-terracota); }
    .divider { border: none; border-top: 1.5px solid var(--lf-linea); margin: 22px 0 14px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-lockup">
      <img src="/brand/isotipo.svg" alt="La Familia">
      <span class="name">La Familia</span>
      <div class="lf-heart-rule"><span>&#9829;</span></div>
      <span class="sub">Menudo y Barbacoa</span>
      <span class="tag">Sazón casero hecho con el corazón</span>
    </div>
    <h1 class="login-title">Acceso al Sistema</h1>
    <p class="login-subtitle">Ingresa con tu cuenta de <strong>administrador</strong> o <strong>cajero</strong></p>

    <!-- Error de credenciales -->
    <div class="error-box" id="errorBox" style="display:none;">
      <i class="fa-solid fa-circle-exclamation"></i>
      Usuario o contraseña incorrectos. Intenta de nuevo.
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="user">Usuario</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-user"></i>
          <input
            type="text"
            id="user"
            name="user"
            placeholder="admin"
            required
            autocomplete="username"
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket"></i>
        Entrar al Panel
      </button>
    </form>

    <hr class="divider">
    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Volver al Menú
    </a>
  </div>

  <script>
    // Mostrar error si la URL contiene ?error=1
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorBox').style.display = 'flex';
    }
  </script>
</body>
</html>
