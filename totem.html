<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosco - Barbacoa & Antojitos</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --accent-color: #f59e0b;
            --text-main: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-height: 80px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: pan-y;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            font-size: 20px;
        }

        .view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 30px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
        }

        .content {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content-top {
            justify-content: flex-start;
        }

        .btn {
            background-color: var(--accent-color);
            color: #1a1a2e;
            border: none;
            border-radius: 20px;
            min-height: var(--btn-height);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 0 40px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(245, 158, 11, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--card-border);
            box-shadow: none;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--text-main);
            font-size: 2.5rem;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            outline: none;
            margin-bottom: 40px;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        #view-welcome .content {
            gap: 40px;
        }
        
        .welcome-title {
            font-size: 4rem;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .order-types {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 800px;
        }

        .order-types .btn {
            flex: 1;
            height: 250px;
            font-size: 2.5rem;
            flex-direction: column;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            align-items: start;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-emoji {
            font-size: 4rem;
            text-align: center;
        }

        .menu-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
        }

        .menu-price {
            color: var(--accent-color);
            font-size: 1.3rem;
            text-align: center;
        }

        .menu-desc {
            font-size: 1rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 15px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 10px;
        }

        .qty-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .kilo-calc {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .kilo-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 10px;
        }

        .kilo-input input {
            flex: 1;
            margin: 0;
            padding: 10px;
            font-size: 1.5rem;
            border-radius: 10px;
        }

        .kilo-result {
            font-size: 1.1rem;
            text-align: center;
            color: #aaa;
        }

        .kilo-add-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .bottom-bar {
            background: #111122;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
        }

        .cart-summary {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .cart-list {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-item-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .cart-item-price {
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .cart-total-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: right;
            margin: 40px 0;
            width: 100%;
            max-width: 800px;
        }

        .cart-actions {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .cart-actions .btn {
            flex: 1;
        }

        .done-icon {
            font-size: 6rem;
            color: #10b981;
            margin-bottom: 20px;
        }
        
        .done-message {
            font-size: 2rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .done-timer {
            margin-top: 40px;
            color: #aaa;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="view-welcome" class="view active" onclick="app.goToName()">
        <div class="content">
            <h1 class="welcome-title">Barbacoa & Antojitos</h1>
            <button class="btn">Toca aquí para ordenar 👆</button>
        </div>
    </div>

    <div id="view-name" class="view">
        <div class="header">¿Cuál es tu nombre?</div>
        <div class="content">
            <input type="text" id="client-name" placeholder="Tu nombre..." autocomplete="off">
            <button class="btn" onclick="app.submitName()">Continuar ➔</button>
            <button class="btn btn-secondary" style="margin-top: 20px;" onclick="app.goToWelcome()">Cancelar</button>
        </div>
    </div>

    <div id="view-order-type" class="view">
        <div class="header">¿Dónde vas a comer?</div>
        <div class="content">
            <div class="order-types">
                <button class="btn" onclick="app.setOrderType('aqui')">Para Aquí 🍽️</button>
                <button class="btn" onclick="app.setOrderType('llevar')">Para Llevar 🛍️</button>
            </div>
            <button class="btn btn-secondary" style="margin-top: 40px;" onclick="app.goToName()">Atrás</button>
        </div>
    </div>

    <div id="view-menu" class="view">
        <div class="header">Nuestro Menú</div>
        <div class="content content-top" style="flex: 1; overflow-y: auto; width: 100%; padding-bottom: 120px;">
            <div class="menu-grid" id="menu-container">
            </div>
        </div>
        <div class="bottom-bar">
            <button class="btn btn-secondary" onclick="app.goToOrderType()">Atrás</button>
            <div class="cart-summary" id="cart-summary-text">Total: $0.00</div>
            <button class="btn" onclick="app.goToCart()">Ver Orden 🛒</button>
        </div>
    </div>

    <div id="view-cart" class="view">
        <div class="header">Revisa tu Orden</div>
        <div class="content content-top" style="flex: 1; overflow-y: auto; width: 100%;">
            <div class="cart-list" id="cart-container">
            </div>
            <div class="cart-total-display" id="cart-total-display">
                Total: $0.00
            </div>
            <div class="cart-actions">
                <button class="btn btn-secondary" onclick="app.goToMenu()">Seguir Comprando</button>
                <button class="btn" onclick="app.submitOrder()">Confirmar Orden ✅</button>
            </div>
        </div>
    </div>

    <div id="view-done" class="view">
        <div class="content">
            <div class="done-icon">✅</div>
            <div class="done-message">¡Tu pedido fue enviado!<br>Tu nombre será llamado cuando esté listo.</div>
            <div class="done-timer" id="done-timer">Reiniciando en 10...</div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="totem.js"></script>
</body>
</html>
